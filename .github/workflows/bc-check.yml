name: Backward compatibility

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  roave-bc-check:
    name: Roave Backward Compatibility Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # The tool compares against the newest tag, so the tags must be fetched.
        fetch-depth: 0

    # The action's container runs as another user than the checkout's owner, so git
    # refuses the workspace. The container's HOME is mounted from the runner's _github_home.
    - name: Trust the workspace inside the action container
      run: HOME="$RUNNER_TEMP/_github_home" git config --global --add safe.directory /github/workspace

    - name: Roave Backward Compatibility Check
      uses: docker://nyholm/roave-bc-check-ga
      with:
        args: --format=github-actions
