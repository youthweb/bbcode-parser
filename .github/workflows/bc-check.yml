name: Backward compatibility

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  roave-bc-check:
    name: Roave Backward Compatibility Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # The tool needs the history and the tags to find the version it compares against.
        fetch-depth: 0

    # The action's container runs as another user than the checkout's owner, so git
    # refuses the workspace. The container's HOME is mounted from the runner's _github_home.
    - name: Trust the workspace inside the action container
      run: mkdir -p "$RUNNER_TEMP/_github_home" && HOME="$RUNNER_TEMP/_github_home" git config --global --add safe.directory /github/workspace

    # Both formats are printed: the console list shows every break in the log, github-actions
    # adds an annotation for each.
    - name: Roave Backward Compatibility Check
      uses: docker://nyholm/roave-bc-check-ga
      with:
        args: --format=console --format=github-actions
