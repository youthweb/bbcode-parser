name: PHP Composer

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php-versions }} on ${{ matrix.operating-system }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        operating-system: ['ubuntu-latest']
        php-versions: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP, with composer and extensions
      uses: shivammathur/setup-php@v2 #https://github.com/shivammathur/setup-php
      with:
        php-version: ${{ matrix.php-versions }}
        tools: phpunit
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite
        coverage: xdebug

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ matrix.operating-system }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ matrix.operating-system }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    # Add a test script to composer.json, for instance: "test": "vendor/bin/phpunit"
    # Docs: https://getcomposer.org/doc/articles/scripts.md

    - name: Run test suite
      run: vendor/bin/phpunit --coverage-text

  code-style:
    name: Code style (PHP CS Fixer)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # PHP 7.4 is the lowest supported version, the fixer runs on it like the code does.
    - name: Setup PHP, with composer
      uses: shivammathur/setup-php@v2
      with:
        php-version: '7.4'
        tools: composer

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run PHP CS Fixer
      run: vendor/bin/php-cs-fixer check --diff

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # PHP 7.4 is the lowest supported version, the analysis runs on it like the code does.
    - name: Setup PHP, with composer
      uses: shivammathur/setup-php@v2
      with:
        php-version: '7.4'
        tools: composer

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    # The level and paths come from phpstan.neon; any error fails the job.
    - name: Run PHPStan
      run: vendor/bin/phpstan analyse --no-progress

  rector:
    name: Rector
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # PHP 7.4 is the lowest supported version, Rector runs on it like the code does.
    - name: Setup PHP, with composer
      uses: shivammathur/setup-php@v2
      with:
        php-version: '7.4'
        tools: composer

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    # Dry run: any change Rector would still make fails the job.
    - name: Run Rector
      run: vendor/bin/rector process --dry-run --no-progress-bar
